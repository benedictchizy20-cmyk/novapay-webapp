<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | NovaPay</title>

  <link
    rel="stylesheet"
    href="./css/auth.css"
  >

</head>

<body>


<div class="auth-page">


  <div class="auth-brand">

    <a href="./index.html">

      <span class="brand-icon">
        N
      </span>

      <span>
        Nova<span>Pay</span>
      </span>

    </a>

  </div>



  <div class="auth-card">


    <div class="auth-heading">

      <p class="eyebrow">
        WELCOME BACK
      </p>

      <h1>
        Login to NovaPay
      </h1>

      <p>
        Access your account and manage your finances.
      </p>

    </div>



    <form id="loginForm">


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>



      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>



      <div
        id="loginMessage"
        class="form-message"
      ></div>



      <button
        type="submit"
        class="auth-button"
      >
        Login
      </button>


    </form>



    <div class="auth-footer">

      <span>
        Don't have an account?
      </span>

      <a href="./register.html">
        Create Account
      </a>

    </div>


  </div>

</div>



<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</body>

</html>
