<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | NovaPay</title>

  <link
    rel="stylesheet"
    href="./css/auth.css"
  >

</head>

<body>


<div class="auth-page">


  <div class="auth-brand">

    <a href="./index.html">

      <span class="brand-icon">
        N
      </span>

      <span>
        Nova<span>Pay</span>
      </span>

    </a>

  </div>



  <div class="auth-card">


    <div class="auth-heading">

      <p class="eyebrow">
        NOVAPAY
      </p>

      <h1>
        Create your account
      </h1>

      <p>
        Start managing your money with NovaPay.
      </p>

    </div>



    <form id="registerForm">


      <div class="form-group">

        <label for="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          name="full_name"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>



      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>



      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="08012345678"
          autocomplete="tel"
          required
        >

      </div>



      <div class="form-row">

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirm_password"
            placeholder="Repeat password"
            autocomplete="new-password"
            required
          >

        </div>

      </div>



      <div
        id="registerMessage"
        class="form-message"
      ></div>



      <button
        type="submit"
        class="auth-button"
      >
        Create Account
      </button>


    </form>



    <div class="auth-footer">

      <span>
        Already have an account?
      </span>

      <a href="./login.html">
        Login
      </a>

    </div>


  </div>

</div>



<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</body>

</html>
